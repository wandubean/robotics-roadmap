<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>noise ε 를 넣었을 때 sampling 결과. 실제 경로의 끝(초록)은 ε 가 음수면 −2, 양수면 +2 로 0 에서 끊어진다. Euler 1 step(주황)은 어떤 ε 에서도 0 이고, 2 step(파랑)은 ε 가 0 에서 멀수록 ±2 에 가까워지지만 ε = 0.5 에서도 1.52 에 그치며, 4 step(보라)은 0 바로 옆에서만 사이 값을 낸다</title>
