<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>데이터가 +2 와 −2 반반일 때 noise ε = 0.5 에서 출발한 실제 경로(회색 점선)는 처음에 조금 내려갔다가 올라가 +2 에 닿는다. 출발점의 순간 속도 −0.5 로 1 step 을 가면 0 에 닿고(주황), 출발점과 도착점을 잇는 평균 속도 1.5 로 1 step 을 가면 +2 에 닿는다(초록)</title>
