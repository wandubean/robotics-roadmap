  <text x="500.0" y="70.0" fill="#d6aa62" font-size="13" text-anchor="start">출발점의 순간 속도</text>
  <text x="500.0" y="90.0" fill="#d6aa62" font-size="13" text-anchor="start">v(0.5, 0) = −0.5</text>
  <text x="500.0" y="110.0" fill="#d6aa62" font-size="13" text-anchor="start">0.5 + 1 × (−0.5) = 0</text>
  <text x="500.0" y="150.0" fill="#7fc4a2" font-size="13" text-anchor="start">출발점 → 도착점의 평균 속도</text>
  <text x="500.0" y="170.0" fill="#7fc4a2" font-size="13" text-anchor="start">(2 − 0.5) ÷ 1 = 1.5</text>
  <text x="500.0" y="190.0" fill="#7fc4a2" font-size="13" text-anchor="start">0.5 + 1 × 1.5 = 2</text>
  <text x="500.0" y="230.0" fill="#94a3b8" font-size="13" text-anchor="start">실제 경로 (step 을 아주 잘게)</text>
  <text x="500.0" y="250.0" fill="#94a3b8" font-size="13" text-anchor="start">t = 1 에서 2.00</text>
