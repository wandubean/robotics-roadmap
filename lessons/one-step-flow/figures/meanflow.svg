  <polyline points="386.4,149.7 470.0,74.3" fill="none" stroke="#7cb4d8" stroke-width="2.3"/>
  <polyline points="90.0,245.7 470.0,74.3" fill="none" stroke="#7fc4a2" stroke-width="2.3"/>
  <circle cx="90.0" cy="245.7" r="3.5" fill="#e2e8f0"/>
  <circle cx="470.0" cy="74.3" r="3.5" fill="#7fc4a2"/>
  <text x="105.2" y="266.9" fill="#d6aa62" font-size="12" text-anchor="start">v(0) = 0</text>
  <text x="446.8" y="125.7" fill="#7cb4d8" font-size="12" text-anchor="middle">v(1) = 2</text>
  <text x="249.6" y="148.0" fill="#7fc4a2" font-size="12" text-anchor="middle">평균 1</text>
  <text x="495.0" y="70.0" fill="#7fc4a2" font-size="13" text-anchor="start">평균 속도 (0 → 1)</text>
  <text x="495.0" y="90.0" fill="#7fc4a2" font-size="13" text-anchor="start">이동량 1 ÷ 시간 1 = 1</text>
  <text x="495.0" y="130.0" fill="#e2e8f0" font-size="13" text-anchor="start">출발 시각 s 의 평균 속도</text>
  <text x="495.0" y="150.0" fill="#e2e8f0" font-size="13" text-anchor="start">(1 − s²) ÷ (1 − s) = 1 + s</text>
  <text x="495.0" y="170.0" fill="#94a3b8" font-size="12" text-anchor="start">s 를 늦추면 1 의 비율로 커짐</text>
  <text x="495.0" y="210.0" fill="#e2e8f0" font-size="13" text-anchor="start">MeanFlow identity (s = 0)</text>
  <text x="495.0" y="230.0" fill="#94a3b8" font-size="12" text-anchor="start">순간 속도 + 남은 시간 × 비율</text>
  <text x="495.0" y="250.0" fill="#e2e8f0" font-size="13" text-anchor="start">0 + (1 − 0) × 1 = 1</text>
</svg>
