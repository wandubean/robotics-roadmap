<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>속도가 v = 2t 로 커지는 점의 경로 x = t² 에서, 출발점 t = 0 의 순간 속도는 0 이고(주황) 끝 t = 1 의 순간 속도는 2 다(파랑). 0 부터 1 까지의 평균 속도는 이동량 1 ÷ 시간 1 = 1 이다(초록). 출발 시각 s 를 늦추면 평균 속도 1 + s 가 1 만큼의 비율로 커지고, MeanFlow identity 는 0 + (1 − 0) × 1 = 1 로 평균 속도를 맞힌다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker></defs>
  <rect x="1" y="1" width="718" height="338" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="90.0" y="40.0" width="380.0" height="240.0" rx="0" fill="#0e1628" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="90.0" y1="245.7" x2="470.0" y2="245.7" stroke="#1e293b" stroke-width="1"/>
  <text x="82.0" y="249.7" fill="#94a3b8" font-size="12" text-anchor="end">0</text>
  <line x1="90.0" y1="160.0" x2="470.0" y2="160.0" stroke="#1e293b" stroke-width="1"/>
  <text x="82.0" y="164.0" fill="#94a3b8" font-size="12" text-anchor="end">0.5</text>
  <line x1="90.0" y1="74.3" x2="470.0" y2="74.3" stroke="#1e293b" stroke-width="1"/>
  <text x="82.0" y="78.3" fill="#94a3b8" font-size="12" text-anchor="end">1</text>
  <line x1="90.0" y1="280.0" x2="90.0" y2="285.0" stroke="#475569" stroke-width="1.5"/>
  <text x="90.0" y="299.0" fill="#94a3b8" font-size="11" text-anchor="middle">0</text>
  <line x1="185.0" y1="280.0" x2="185.0" y2="285.0" stroke="#475569" stroke-width="1.5"/>
  <text x="185.0" y="299.0" fill="#94a3b8" font-size="11" text-anchor="middle">0.25</text>
  <line x1="280.0" y1="280.0" x2="280.0" y2="285.0" stroke="#475569" stroke-width="1.5"/>
  <text x="280.0" y="299.0" fill="#94a3b8" font-size="11" text-anchor="middle">0.5</text>
  <line x1="375.0" y1="280.0" x2="375.0" y2="285.0" stroke="#475569" stroke-width="1.5"/>
  <text x="375.0" y="299.0" fill="#94a3b8" font-size="11" text-anchor="middle">0.75</text>
  <line x1="470.0" y1="280.0" x2="470.0" y2="285.0" stroke="#475569" stroke-width="1.5"/>
  <text x="470.0" y="299.0" fill="#94a3b8" font-size="11" text-anchor="middle">1</text>
  <text x="280.0" y="318.0" fill="#94a3b8" font-size="12" text-anchor="middle">시각 t</text>
  <text x="40.0" y="160.0" fill="#94a3b8" font-size="12" text-anchor="middle">x</text>
  <polyline points="90.0,245.7 93.8,245.7 97.6,245.6 101.4,245.6 105.2,245.4 109.0,245.3 112.8,245.1 116.6,244.9 120.4,244.6 124.2,244.3 128.0,244.0 131.8,243.6 135.6,243.2 139.4,242.8 143.2,242.4 147.0,241.9 150.8,241.3 154.6,240.8 158.4,240.2 162.2,239.5 166.0,238.9 169.8,238.2 173.6,237.4 177.4,236.6 181.2,235.8 185.0,235.0 188.8,234.1 192.6,233.2 196.4,232.3 200.2,231.3 204.0,230.3 207.8,229.2 211.6,228.2 215.4,227.0 219.2,225.9 223.0,224.7 226.8,223.5 230.6,222.2 234.4,221.0 238.2,219.6 242.0,218.3 245.8,216.9 249.6,215.5 253.4,214.0 257.2,212.5 261.0,211.0 264.8,209.4 268.6,207.8 272.4,206.2 276.2,204.6 280.0,202.9 283.8,201.1 287.6,199.4 291.4,197.6 295.2,195.7 299.0,193.9 302.8,192.0 306.6,190.0 310.4,188.0 314.2,186.0 318.0,184.0 321.8,181.9 325.6,179.8 329.4,177.7 333.2,175.5 337.0,173.3 340.8,171.0 344.6,168.8 348.4,166.4 352.2,164.1 356.0,161.7 359.8,159.3 363.6,156.8 367.4,154.4 371.2,151.8 375.0,149.3 378.8,146.7 382.6,144.1 386.4,141.4 390.2,138.7 394.0,136.0 397.8,133.2 401.6,130.4 405.4,127.6 409.2,124.8 413.0,121.9 416.8,118.9 420.6,116.0 424.4,113.0 428.2,109.9 432.0,106.9 435.8,103.8 439.6,100.6 443.4,97.4 447.2,94.2 451.0,91.0 454.8,87.7 458.6,84.4 462.4,81.1 466.2,77.7 470.0,74.3" fill="none" stroke="#94a3b8" stroke-width="2.0" stroke-dasharray="4 3"/>
