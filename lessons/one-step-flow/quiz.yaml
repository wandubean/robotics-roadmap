# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: average-velocity
  title: 순간 속도와 평균 속도
  section: 순간-속도와-평균-속도
  variants:
    - question: |
        flow matching 으로 학습한 network 는 위치 $x$ 와 시각 $t$ 에서의 순간 속도를 낸다. 생성 경로가 휘어 있을 때 Euler step 한 번
        ($t = 0$ 에서 1 까지)으로는 도착점에 닿지 못하는 이유는 무엇인가?
      choices:
        - 'Euler step 은 network 를 한 번 쓸 때마다 새 noise 를 더해서 경로가 무작위로 흔들리기 때문이다'
        - '출발 순간의 방향으로 끝까지 직진해서, 그 뒤에 바뀌는 경로의 방향을 반영하지 못하기 때문이다'
        - '순간 속도는 $t = 1$ 근처에서만 정확하게 학습되고 $t = 0$ 근처에서는 학습되지 않기 때문이다'
        - 'step 하나에 network 를 두 번 써야 하는데 Euler 법은 한 번만 써서 계산이 모자라기 때문이다'
      answer: 1
      explanation: |
        Euler step 은 step 을 시작할 때의 순간 속도로 step 끝까지 직진한다. 경로가 휘면 도중에 방향이 바뀌는데 그 변화를 반영하지
        못해 도착점을 벗어난다. Euler step 은 새 noise 를 더하지 않으며, 새 noise 를 더하는 쪽은 DDPM 의 reverse step 이다. flow
        matching 은 학습 중에 $t$ 를 0 과 1 사이에서 고르게 뽑아 $t = 0$ 근처를 포함한 모든 시각의 속도를 학습한다. Euler 법은 원래 step 하나에
        network 를 한 번만 쓰고, 계산이 모자라서가 아니라 직진하는 방식 때문에 어긋난다.
    - question: |
        어떤 점의 경로가 휘어 있다. $t = 0$ 부터 1 까지의 평균 속도로 한 번 직진하면 도착점에 정확히 닿는 이유는 무엇인가?
      choices:
        - '평균 속도는 출발점과 도착점 사이의 순간 속도 가운데 가장 큰 값이라, 어디든 충분히 멀리 갈 수 있기 때문이다'
        - '평균 속도로 가면 경로가 휜 정도만큼 network 가 출발점의 위치를 자동으로 고쳐 주기 때문이다'
        - '평균 속도는 이동량을 걸린 시간으로 나눈 값이라, 시간을 곱하면 경로 모양과 상관없이 이동량이 되기 때문이다'
        - '평균 속도는 출발점의 순간 속도와 늘 같은 값이라서 휜 경로에서도 같은 방향을 가리키기 때문이다'
      answer: 2
      explanation: |
        평균 속도는 이동량을 걸린 시간으로 나눈 값이라 걸린 시간을 곱하면 이동량이 되고, 이 이동량을 출발점에 더하면 도착점이다. 경로가
        어떻게 휘었는지는 상관없다. 평균 속도는 가장 큰 순간 속도가 아니라 순간 속도들을 시간으로 평균한 값이다. network 가 출발점의 위치를
        고치는 일은 없다. 휜 경로에서는 출발점의 순간 속도와 평균 속도가 다르고, 순간 속도 $-0.5$ 와 평균 속도 1.5 처럼 부호까지 다를 수 있다.
    - question: |
        one-step 방법의 network 는 보통의 flow matching network 와 달리 도착 시각이나 step 의 크기를 입력으로 받거나, 도착 시각을 1 로
        정해 둔다. 왜 이런 정보가 필요한가?
      choices:
        - '평균 속도는 출발 시각과 도착 시각에 따라 값이 달라지므로, 어느 구간의 평균인지 정해져야 하기 때문이다'
        - '도착 시각이 없으면 network 가 noise 와 데이터 중 어느 쪽이 출발점인지 구별할 수 없기 때문이다'
        - 'step 크기를 받아야 학습할 때 batch 를 여러 크기로 나눠 GPU 에서 병렬로 계산할 수 있기 때문이다'
        - '도착 시각을 넣으면 network 가 새 noise 를 뽑아 더할 시점을 알 수 있어 sample 이 다양해지기 때문이다'
      answer: 0
      explanation: |
        같은 점에서 출발해도 $t = 0$ 부터 0.5 까지의 평균 속도와 $t = 0$ 부터 1 까지의 평균 속도는 다르므로, network 가 어느 구간의
        평균을 낼지 알아야 한다. 출발점이 어느 쪽인지는 시각 $t$ 만으로도 구별된다. step 크기는 어느 구간의 정답인지 정하려고 받으며,
        병렬 계산과는 관계없다. one-step 방법의 sampling 은 step 사이에 새 noise 를 더하지 않는다.

- topic: endpoint-map
  title: noise 와 결과의 짝
  section: noise-와-결과의-짝
  variants:
    - question: |
        데이터가 $+2$ 와 $-2$ 반반이고 flow matching 모델이 잘 학습되었다. noise 를 넣으면 경로의 끝이 나오는 함수는 어떤 모양인가?
      choices:
        - 'noise 가 커질수록 결과도 일정한 비율로 커지는 직선이라, 결과가 $-2$ 와 $+2$ 사이에 고르게 퍼진다'
        - '어떤 noise 를 넣어도 두 데이터의 평균인 0 이 나오는 평평한 모양이고, step 수와 상관없이 같다'
        - 'noise 가 음수면 $-2$ 가 나오고 양수면 $+2$ 가 나와서, noise 0 을 경계로 결과가 끊어져 뛰는 모양이다'
        - 'noise 의 절댓값이 1 보다 작으면 0 이 나오고, 1 보다 크면 그 부호 쪽의 데이터가 나오는 계단 모양이라 결과 값이 셋뿐이다'
      answer: 2
      explanation: |
        학습된 경로는 엇갈리지 않아서 양수 noise 는 모두 $+2$ 로 가고 음수 noise 는 모두 $-2$ 로 가므로, 함수가 noise 0 에서
        끊어져 뛴다. 결과가 고르게 퍼지는 직선이라면 데이터에 없던 사이 값이 나온다. 모든 noise 가 0 으로 가는 것은 실제 경로의 끝이 아니라
        Euler 1 step 의 결과다. 절댓값 1 을 기준으로 나뉘는 계단은 없고, 0 근처의 작은 noise 도 부호를 따라 $+2$ 나 $-2$ 로 간다.
    - question: |
        one-step 모델이 noise 를 결과로 보내는 함수를 배울 때, 결과가 $-2$ 에서 $+2$ 로 끊어져 뛰는 noise 0 근처에서 생기는 문제는 무엇인가?
      choices:
        - 'network 의 출력은 매끄럽게 변해서, 0 근처 noise 에서 두 봉우리 사이의 값이 나올 수 있다'
        - 'noise 가 0 근처면 학습 batch 에 거의 뽑히지 않아서, 그 자리의 결과가 늘 $+2$ 로 굳는다'
        - '0 근처에서는 network 의 gradient 가 0 이 되어, 학습이 멈추고 loss 가 더 줄어들지 않는다'
        - '0 근처 noise 는 반드시 두 봉우리를 번갈아 내서, 같은 noise 로도 매번 결과가 바뀌게 된다'
      answer: 0
      explanation: |
        network 의 출력은 입력을 조금 바꾸면 조금만 바뀌는 매끄러운 함수라서 수직으로 뛰는 모양을 완벽하게 만들기 어렵고, 그래서 0 근처의
        noise 에서 두 봉우리 사이 값이 나올 수 있다. 0 근처 noise 도 정규분포에서 가장 자주 뽑히는 쪽이라 학습에서 빠지지 않는다. gradient 가
        0 이 되어 학습이 멈추는 것은 이 문제의 원인이 아니다. 같은 noise 를 넣으면 같은 계산을 하므로 결과가 매번 바뀌지 않는다.
    - question: |
        로봇 시연에 상자를 왼쪽으로 비켜 가는 길과 오른쪽으로 비켜 가는 길이 반반 섞여 있다. one-step policy 가 noise 를 action 으로
        보내는 함수의 끊어지는 자리를 날카롭게 배우지 못하면 실행 중에 어떤 일이 생기는가?
      choices:
        - '모든 noise 가 한쪽 길로만 가서, 다른 쪽 길은 noise 를 아무리 바꿔도 다시 나오지 않는다'
        - 'noise 마다 결과가 크게 흔들려서, 같은 장면에서 왼쪽과 오른쪽을 매번 번갈아 고르게 된다'
        - '끊어지는 자리 근처의 noise 에서 두 길의 중간인 상자 정면으로 가는 action 이 가끔 나온다'
        - 'action 의 크기가 0 이 되어 로봇이 그 자리에 멈추고, 다음 chunk 가 나올 때까지 기다린다'
      answer: 2
      explanation: |
        끊어지는 자리를 비스듬하게 배우면 그 근처 noise 에서 두 길의 중간인 상자 정면으로 가는 action 이 나오고, 이런 action 은 그 noise 가
        뽑히는 확률만큼 가끔 생긴다. 끊어지는 자리를 무디게 배워도 양쪽 noise 는 여전히 각자의 길로 가므로 한쪽 길이 사라지지 않는다.
        사이 값은 끊어지는 자리 근처에서만 나오므로 매번 번갈아 고르지 않는다. 중간 값은 0 크기의 action 이 아니라 두 길의 평균 방향이다.

- topic: reflow
  title: reflow
  section: reflow
  variants:
    - question: |
        reflow 는 학습을 마친 flow matching 모델을 어떻게 다시 학습하는가?
      choices:
        - '학습 데이터를 두 배로 늘리고, noise 와 데이터를 무작위로 다시 짝지어 같은 loss 로 더 오래 학습한다'
        - '모델이 noise 에서 만든 결과와 그 noise 를 짝지어, 그 짝을 잇는 직선의 속도로 flow matching 을 한 번 더 학습한다'
        - '모델의 step 수를 절반씩 줄여 가며, 줄인 모델의 출력을 원래 모델의 출력과 같게 맞추도록 학습한다'
        - '학습된 velocity field 를 저장해 두고, sampling 할 때 경로가 휜 자리마다 step 을 더 잘게 나눠 다시 계산하게 한다'
      answer: 1
      explanation: |
        reflow 는 무작위 짝 대신 모델이 실제로 만든 (noise, 결과) 짝으로 직선을 다시 긋고 그 직선의 속도를 정답으로 flow matching 을 한
        번 더 학습한다. 이 짝은 엇갈리지 않아서 경로가 곧아진다. 무작위로 다시 짝지으면 엇갈림이 그대로 남는다. step 수를 절반씩 줄이며
        출력을 맞추는 것은 reflow 가 아니다. sampling 때 step 을 잘게 나누는 것은 계산만 늘릴 뿐 다시 학습하는 방법이 아니다.
    - question: |
        reflow 한 모델에서 1 step 으로 데이터에 닿을 수 있게 되는 이유는 무엇인가?
      choices:
        - '모델이 만든 짝으로 그은 직선은 서로 엇갈리지 않아서, network 가 평균을 낼 필요 없이 직선의 속도를 그대로 배우기 때문이다'
        - 'reflow 에서는 network 의 크기를 두 배로 키워서, 휜 경로의 순간 속도를 더 정확하게 맞힐 수 있게 되기 때문이다'
        - 'reflow 는 noise 를 쓰지 않고 데이터끼리 짝지어 학습해서, 출발점부터 이미 데이터 위에 놓이기 때문이다'
        - 'reflow 는 sampling 할 때 새 noise 를 섞어 주어서, 한 step 만에도 경로가 데이터 쪽으로 끌려가기 때문이다'
      answer: 0
      explanation: |
        처음 학습에서는 무작위 짝의 직선이 엇갈려 network 가 엇갈리는 자리에서 정답 속도의 평균을 배우고, 그래서 경로가 휜다. 모델이
        만든 짝은 엇갈리지 않으므로 network 가 직선의 속도를 그대로 배워 1 step 으로 데이터에 닿는다. reflow 는 network 를 키우는 방법이 아니다.
        reflow 도 데이터가 아닌 noise 에서 출발한다. reflow 는 sampling 때 새 noise 를 섞지 않는다.
    - question: |
        reflow 의 학습 비용에 대한 설명으로 맞는 것은 무엇인가?
      choices:
        - '처음 모델이 필요 없어서, 무작위로 초기화한 network 에서 짝을 만들고 곧바로 1 step 모델을 학습할 수 있다'
        - '짝을 만들 필요가 없어서, 보통의 flow matching 과 학습 비용이 정확히 같고 추가 계산이 없다'
        - '먼저 모델을 끝까지 학습한 뒤, 그 모델로 noise 마다 여러 step 의 sampling 을 해서 짝을 만들어야 한다'
        - '학습은 그대로이고 sampling 할 때만 짝을 만들어서, 추론 시간이 처음 모델보다 오히려 길어진다'
      answer: 2
      explanation: |
        reflow 는 두 단계로 학습한다. 처음 모델을 끝까지 학습하고, 그 모델로 noise 마다 여러 step 의 sampling 을 해서 짝을 만든 뒤 다시
        학습하므로 짝을 만드는 계산이 sample 개수 × step 수만큼 든다. 처음 모델 없이는 짝을 만들 수 없다. 짝을 만드는 계산 때문에
        보통의 flow matching 보다 비용이 크다. 짝은 학습 전에 만들고, 학습한 뒤의 sampling 은 1 step 이라 더 빠르다.

- topic: consistency
  title: distillation 과 consistency model
  section: distillation-과-consistency-model
  variants:
    - question: |
        consistency model 의 network $f(x_t, t)$ 가 지켜야 하는 self-consistency 는 무엇인가?
      choices:
        - '같은 시각의 서로 다른 점에 같은 값을 내서, 시각마다 출력이 하나로 정해지게 하는 조건이다'
        - '같은 경로 위의 점이면 시각이 달라도 모두 그 경로의 끝이라는 같은 값을 내야 한다는 조건이다'
        - '출력과 입력의 차이가 시각 $t$ 에 비례해서, 끝에 가까울수록 출력이 입력에서 멀어지는 조건이다'
        - '경로 위의 이웃한 두 점의 순간 속도가 같아서, 경로가 어디서나 직선이 되게 하는 조건이다'
      answer: 1
      explanation: |
        consistency model 은 경로 위의 어느 점을 받든 그 경로의 끝을 낸다. 같은 경로 위의 점은 끝이 같으므로 시각이 달라도 출력이 같아야
        한다. 같은 시각의 다른 점은 다른 경로 위에 있을 수 있어서 끝이 다르다. 끝에 가까운 점일수록 입력이 이미 경로의 끝에 가까우므로 출력이
        입력에서 멀어지지 않는다. 경로를 직선으로 만드는 것은 reflow 의 목표에 가깝고, consistency model 의 조건은 끝 값이 같다는 것이다.
    - question: |
        consistency distillation(CD)과 consistency training(CT)의 차이로 맞는 것은 무엇인가?
      choices:
        - 'CD 는 network 를 한 번만 쓰고, CT 는 학습할 때와 sampling 할 때 network 를 여러 번 써야 한다'
        - 'CD 는 데이터 없이 noise 만으로 학습하고, CT 는 데이터와 noise 를 모두 써서 학습한다'
        - 'CD 는 teacher 로 이웃한 점을 만들어 두 단계로 학습하고, CT 는 teacher 없이 같은 noise 로 두 점을 만든다'
        - 'CD 는 boundary condition 이 필요 없고, CT 만 경로의 끝에서 입력을 그대로 내도록 출력을 고정한다'
      answer: 2
      explanation: |
        CD 는 학습된 모델(teacher)로 solver step 을 한 번 밟아 같은 경로 위의 이웃한 점을 만들기 때문에 teacher 를 먼저 학습해야
        하는 두 단계 학습이다. CT 는 같은 데이터와 같은 noise 를 두 시각으로 섞어 두 점을 만들므로 teacher 가 필요 없다. 두 방법 모두 1 step sampling 을
        할 수 있다. CD 도 데이터를 쓴다. boundary condition 은 두 방법 모두 network 출력 식으로 지킨다.
    - question: |
        consistency model 을 학습할 때 같은 경로 위의 두 점 중 경로의 끝에 더 가까운 점의 출력을 정답으로 두는 이유는 무엇인가?
      choices:
        - '끝에 가까운 점은 network 를 두 번 써서 계산하므로, 한 번만 쓴 출력보다 늘 두 배 정확하기 때문이다'
        - '끝에 가까운 점의 출력은 학습 중에도 바뀌지 않는 상수라서, 정답으로 쓰기에 안정적이기 때문이다'
        - '끝에 가까운 점에서는 network 대신 실제 데이터를 그대로 넣어 주므로, 정답이 언제나 정확하기 때문이다'
        - '끝에 가까울수록 남은 경로가 짧아서 끝을 맞히기 쉽고, 경로의 끝에서는 출력이 입력과 같도록 고정되기 때문이다'
      answer: 3
      explanation: |
        경로의 끝에서는 boundary condition 에 따라 출력이 입력 그대로라 정확하고, 끝에 가까운 점일수록 남은 경로가 짧아 출력이 정답에 가깝다.
        그래서 먼 쪽 점의 출력을 가까운 쪽 점의 출력에 맞추면 정확한 값이 끝에서부터 퍼져 나간다. 끝에 가까운 점도 network 를 한 번
        쓴다. 정답 쪽 출력은 EMA network 로 계산하므로 학습을 따라 천천히 바뀐다. 실제 데이터를 넣는 것은 경로의 끝 한 점뿐이다.

- topic: shortcut
  title: shortcut model
  section: shortcut-model
  variants:
    - question: |
        shortcut model 이 크기 $2d$ 인 step 의 정답 속도를 만드는 방법은 무엇인가?
      choices:
        - '크기 $d$ 인 step 을 network 로 두 번 계산하고, 두 step 에서 나온 속도의 평균을 정답으로 쓴다'
        - '데이터와 noise 의 차이 $x_1 - \epsilon$ 을 $2d$ 로 나눠서, step 크기에 맞게 줄인 값을 정답으로 쓴다'
        - '미리 학습한 teacher 모델로 크기 $2d$ 의 구간을 여러 step 으로 계산한 결과를 정답으로 쓴다'
        - '크기 $d$ 인 step 의 속도에 2 를 곱해서, 두 배 긴 구간을 같은 시간에 가는 속도를 정답으로 쓴다'
      answer: 0
      explanation: |
        크기 $d$ 로 두 번 가는 것과 크기 $2d$ 로 한 번 가는 것이 같은 자리에 닿으려면 큰 step 의 속도가 작은 두 step 속도의 평균이어야
        한다. 그래서 network 로 작은 step 두 번을 계산해 그 평균을 정답으로 쓴다. $x_1 - \epsilon$ 은 $d = 0$ 의 flow matching 정답이라서
        $2d$ 로 나눌 이유가 없다. shortcut model 은 teacher 없이 한 번에 학습한다. 작은 step 의 속도에 2 를 곱하면 큰 step 에서 두 배 멀리 가서
        작은 step 두 번과 다른 자리에 닿는다.
    - question: |
        shortcut model 의 network 에 step 크기 $d = 0$ 을 넣고 학습하는 부분은 무엇을 배우는가?
      choices:
        - '한 번에 $t = 0$ 부터 1 까지 건너뛰는 평균 속도를 배워서, 1 step sampling 에 그대로 쓰인다'
        - '보통의 flow matching 처럼 순간 속도 $x_1 - \epsilon$ 을 배우고, 큰 step 정답의 바탕이 된다'
        - '아무것도 배우지 않는 자리라서 loss 에서 빼고, $d$ 가 0 보다 큰 경우만 학습에 쓴다'
        - '정지 상태를 나타내서, network 가 0 을 내도록 학습해 경로의 끝에서 멈추게 한다'
      answer: 1
      explanation: |
        $d$ 가 0 에 가까우면 건너뛰는 구간이 아주 짧아 평균 속도가 순간 속도와 같다. 그래서 $d = 0$ 에서는 flow matching 처럼
        $x_1 - \epsilon$ 을 맞히고, 가장 작은 step 의 정답도 이 값으로 계산해 큰 step 의 정답이 그 위에 쌓인다. $t = 0$ 부터 1 까지의
        평균 속도는 $d = 1$ 의 몫이다. $d = 0$ 부분은 batch 의 3/4 를 차지하는 주된 학습이다. 0 을 내도록 학습하는 일은 없다.
    - question: |
        shortcut model 을 한 번 학습하면 sampling 의 step 수에 대해 무엇을 할 수 있는가?
      choices:
        - 'step 수는 학습할 때 정한 1 로 고정되어서, 다른 step 수를 쓰려면 network 를 그 step 수에 맞춰 처음부터 다시 학습해야 한다'
        - 'step 수를 늘릴수록 결과가 무조건 나빠져서, 1 step 외에는 쓸 이유가 없는 모델이 된다'
        - '같은 network 에 step 크기만 바꿔 넣어 1 step, 4 step, 128 step 등을 상황에 맞게 고를 수 있다'
        - 'step 수는 자유롭지만 매번 teacher 모델을 함께 불러야 해서, 추론 때 network 를 두 개 쓴다'
      answer: 2
      explanation: |
        shortcut model 은 step 크기 $d$ 를 입력으로 받아서, 한 network 에 $d$ 를 바꿔 넣으면 1 step 부터 128 step 까지 고를 수 있다.
        Frans 등은 같은 모델을 128·4·1 step 으로 평가했으므로 step 수는 고정되지 않는다. FID 는 128 step 에서 15.5, 4 step 에서 28.3,
        1 step 에서 40.3 으로 step 이 많을수록 좋았다. shortcut model 은 teacher 를 쓰지 않는다.

- topic: meanflow
  title: MeanFlow
  section: meanflow
  variants:
    - question: |
        MeanFlow identity 는 평균 속도 $u$ 를 무엇으로 나타내는가? 출발 시각을 $s$, 도착 시각을 $e$ 라 한다.
      choices:
        - '출발할 때의 순간 속도와 도착할 때의 순간 속도를 더해 2 로 나눈 값으로 나타낸다'
        - '데이터와 noise 의 차이 $x_1 - \epsilon$ 에 남은 시간 $e - s$ 를 곱한 값으로 나타낸다'
        - '도착할 때의 순간 속도에서 출발할 때의 순간 속도를 뺀 차이를 남은 시간으로 나눠 나타낸다'
        - '출발할 때의 순간 속도에 남은 시간 × (출발 시각을 늦출 때 $u$ 가 변하는 비율)을 더해 나타낸다'
      answer: 3
      explanation: |
        MeanFlow identity 는 $u = v + (e - s) \times \frac{d}{ds} u$ 다. 출발을 늦추면 경로의 앞부분이 평균에서 빠지는데 빠지는 부분의 속도가
        지금의 순간 속도라서 두 속도가 이렇게 묶인다. 두 끝의 순간 속도를 평균한 값은 휜 경로의 평균 속도와 다를 수 있다.
        $x_1 - \epsilon$ 에 시간을 곱하면 속도가 아니라 이동량이다. 두 순간 속도의 차이를 시간으로 나누면 속도가 변하는 비율이 된다.
    - question: |
        MeanFlow 가 학습에 쓰는 정답을 만드는 방법으로 맞는 것은 무엇인가?
      choices:
        - '미리 학습한 flow matching 모델을 끝까지 계산해 얻은 결과로 평균 속도를 구해 정답으로 쓴다'
        - '작은 step 두 번의 속도를 network 로 계산하고, 그 평균을 한 단계 큰 step 의 정답으로 쓴다'
        - 'identity 오른쪽의 순간 속도에 $x_1 - \epsilon$ 을 넣고, 변하는 비율은 network 자신의 출력을 미분해 구한다'
        - '데이터와 noise 를 잇는 직선의 기울기를 그대로 정답으로 쓰므로, 학습 방법이 보통의 flow matching 과 처음부터 완전히 같다'
      answer: 2
      explanation: |
        MeanFlow 는 identity 의 오른쪽을 정답으로 쓴다. 순간 속도 자리에는 쌍 하나의 $x_1 - \epsilon$ 을 넣고, $\frac{d}{ds} u$ 는
        학습 중인 network 의 출력을 미분해 구하며 정답으로만 쓴다. teacher 를 끝까지 계산하는 것은 distillation 이다. 작은 step
        두 번의 평균은 shortcut model 의 방법이다. 출발 시각과 도착 시각이 같을 때만 정답이 $x_1 - \epsilon$ 이 되어 flow matching 과 같아진다.
    - question: |
        Geng 등의 실험에서 batch 중 출발 시각과 도착 시각을 다르게 뽑는 비율을 0% 로 두면 1 step FID 가 328.91 이고, 25% 로 두면 61.06
        이었다. 0% 에서 1 step FID 가 크게 나빠지는 이유는 무엇인가?
      choices:
        - '0% 면 두 시각이 늘 같아 정답이 순간 속도가 되므로, 보통의 flow matching 처럼 1 step 이 평균을 내기 때문이다'
        - '0% 면 미분 계산이 두 배로 늘어 학습 시간이 모자라서, 같은 epoch 안에 학습이 끝나지 못하기 때문이다'
        - '0% 면 batch 에 데이터가 하나도 들어가지 않아서, network 가 noise 만 보고 학습하게 되기 때문이다'
        - '0% 면 boundary condition 이 깨져서, 경로의 끝에서 출력이 입력과 같아지지 않기 때문이다'
      answer: 0
      explanation: |
        두 시각이 같으면 남은 시간이 0 이라 정답이 순간 속도 $x_1 - \epsilon$ 이 되어 보통의 flow matching 과 같다. 순간 속도로 1 step 을
        가면 두 봉우리의 평균을 내서 결과가 크게 나빠진다. 미분 계산은 학습 step 의 계산을 약 16% 늘릴 뿐이라 학습을 끝내는 데 지장이 없다. 비율과 상관없이 batch 에는 데이터와 noise 가 함께 들어간다. MeanFlow 는 평균 속도를 내므로 boundary condition 이 학습
        조건으로 따로 필요하지 않다.

- topic: robot-onestep
  title: 로봇 policy 의 one-step
  section: 로봇-policy-의-one-step
  variants:
    - question: |
        π0.5 의 action 생성을 Euler 10 step 에서 1 step 으로 줄였더니 A800 에서 계산 시간이 274 ms 에서 83 ms 로 줄었다. step 수를 10 배
        줄였는데 시간이 3.3 배만 준 이유는 무엇인가?
      choices:
        - '1 step 모델은 network 가 10 배 커져서, 한 번 계산하는 시간이 원래 step 하나보다 훨씬 길기 때문이다'
        - 'VLM 이 이미지와 지시문을 읽는 계산은 step 수와 상관없이 chunk 마다 한 번 해서 그대로 남기 때문이다'
        - '1 step 으로 바꾸면 action chunk 의 길이가 10 배로 늘어나서, 한 chunk 에 계산할 action 이 많기 때문이다'
        - 'A800 은 network 를 한 번만 부를 때 GPU 를 깨우는 시간이 커서, 짧은 계산일수록 손해를 보기 때문이다'
      answer: 1
      explanation: |
        one-step 은 action 을 만드는 network 의 반복만 줄인다. 274 ms 중 action expert 가 약 214 ms 였고, VLM 이 관측을 읽는 약 60 ms 는
        step 수와 상관없이 남아서 3.3 배만 빨라졌다. 1 step 모델의 network 를 10 배로 키우지 않았다. chunk 길이는 바뀌지 않았다. GPU 를
        깨우는 시간이 주된 원인이라는 근거는 없고, 남은 시간은 VLM 계산이다.
    - question: |
        Diffusion Policy 를 아무 추가 학습 없이 1 step 으로 sampling 하면 Push-T 성공률이 0.12 였고, 1 step 용으로 학습한 shortcut model 은
        0.87 이었다. 이 결과가 보여 주는 것은 무엇인가?
      choices:
        - 'Push-T 는 1 step 으로는 풀 수 없는 과제라서, 어떤 방법으로 학습해도 성공률이 크게 떨어진다'
        - 'shortcut model 의 network 가 Diffusion Policy 보다 훨씬 커서, 같은 1 step 에서 더 잘 맞힌다'
        - '여러 step 용으로 학습한 모델을 1 step 으로 쓰면 크게 떨어지고, 1 step 에 맞는 학습을 해야 한다'
        - 'Diffusion Policy 는 1 step 에서 새 noise 를 더하지 못해서, 같은 action 만 반복해 실패한다'
      answer: 2
      explanation: |
        같은 과제에서 여러 step 용 모델을 그대로 1 step 으로 쓰면 성공률이 0.12 였고, 1 step 에 맞게 학습한 모델은 0.87 이었다. 그래서 1 step
        으로 쓰려면 그에 맞는 학습이 필요하다. shortcut model 이 0.87 을 냈으므로 Push-T 는 1 step 으로도 풀 수 있다. 결과의 차이는
        network 의 크기가 아니라 학습 방법에서 온다. Diffusion Policy 는 여러 step 을 전제로 학습한 모델이라 1 step 으로 크게 건너뛰면
        결과가 크게 나빠진다. 같은 action 만 반복한다는 근거는 없다.
    - question: |
        이미 여러 step 으로 잘 동작하는 flow matching VLA 가 있고 계산 시간 대부분이 action expert 에서 든다. one-step 으로 바꿀 때 가장
        알맞은 출발점은 무엇인가?
      choices:
        - '기존 모델은 버리고, 무작위로 초기화한 network 를 MeanFlow 로 처음부터 학습해 1 step 모델을 만든다'
        - '기존 모델을 teacher 나 출발점으로 쓰는 distillation 으로, 같은 모델을 1 step 으로 줄인다'
        - '기존 모델의 이미지 encoder 와 VLM 을 더 작은 것으로 바꿔서, action expert 의 반복을 줄인다'
        - '기존 모델의 Euler step 수만 1 로 바꿔 쓰면 되므로, 다시 학습할 필요가 전혀 없다'
      answer: 1
      explanation: |
        잘 동작하는 여러 step 모델이 있으면 그 모델을 teacher 나 출발점으로 쓰는 distillation 이 자연스럽다. SnapFlow 저자들은 π0.5 를 A800 한
        장으로 약 12 시간 학습해 1 step 으로 줄였다. 처음부터 학습하면 이미 가진 모델을 버리게 된다. 이미지 encoder 와 VLM 을 줄이는 것은
        계산 시간 대부분이 그쪽에서 들 때의 처방이다. step 수만 1 로 바꾸면 과제에 따라 성공률이 크게 떨어질 수 있다.
